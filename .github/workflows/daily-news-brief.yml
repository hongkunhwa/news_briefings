name: Daily Bank Finance News Brief

on:
  schedule:
    # Korea 07:55 = UTC 22:55 on the previous day.
    # GitHub scheduled workflows can be delayed at the top of the hour,
    # so this avoids the 00-minute queue and lands the brief around 08:00 KST.
    - cron: "55 22 * * *"
  workflow_dispatch:

jobs:
  brief:
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_PROVIDER: gemini
      LLM_MODEL: gemini-2.5-flash
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install feedparser requests gspread google-auth

      - name: Collect banking and finance RSS articles from the last 24 hours
        run: python outputs/collect_korean_news_rss.py --hours 24 --max-per-category 6 --output outputs/news_recent_24h.json

      - name: Summarize and classify banking and finance articles
        timeout-minutes: 25
        run: python outputs/summarize_news_with_llm.py --input outputs/news_recent_24h.json --sleep 10.0 --max-tokens 1000 --retries 1 --retry-sleep 60 --min-success-ratio 0.5

      - name: Check summarized article count
        run: python -c "import json, sys; data=json.load(open('outputs/news_recent_24h.json', encoding='utf-8')); items=data.get('items', []); summarized=sum(1 for item in items if item.get('summary_ko')); ratio=(summarized/len(items)) if items else 1; print(f'articles={len(items)}, summarized={summarized}, ratio={ratio:.1%}'); sys.exit(1 if items and ratio < 0.5 else 0)"

      - name: Post brief to Discord
        run: python outputs/post_news_to_discord.py --input outputs/news_recent_24h.json

      - name: Append brief to Google Sheets
        run: python outputs/append_news_to_sheets.py --input outputs/news_recent_24h.json
